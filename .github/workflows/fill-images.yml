name: 소식 사진 자동 채우기

on:
  push:
    branches: [main]
    paths:
      - "news.json"
      - "scripts/fill_images.py"
      - ".github/workflows/fill-images.yml"
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * *"   # 매일 오전 8:30(한국) 못 찾은 사진 재시도

permissions:
  contents: write
  pages: write   # 커밋 후 GitHub Pages 빌드를 명시적으로 요청하기 위함 (설정/소스는 바꾸지 않음)

# add-news.yml과 같은 그룹: news.json에 쓰는 두 워크플로를 한 번에 하나만 실행합니다.
# (주의) 같은 그룹을 쓰면 글 게시(add-news)가 이미 돌고 있는 사진 채우기 뒤에서 잠깐
# 대기할 수 있습니다. 그 대기 시간이 길어지지 않도록 아래 FILL_IMAGES_TIME_BUDGET_SEC로
# 한 번 실행 시간을 짧게 묶어 둡니다 (게시가 길게 막히는 일을 막기 위함).
concurrency:
  group: news-write
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # 기본값(이 워크플로를 '깨운' 시점의 고정 SHA)이 아니라 밌치 최신 커밋을 명시적으로 요청합니다.
          # concurrency 그룹(news-write)이 작업 '본문' 실행만 한 번에 하나로 막기 때문에, 이 작업이 대기열에서
          # 기다리는 동안 다른 실행(수동 재실행 등)이 먼저 커밋·푸시를 끝냈을 수 있습니다. ref를 고정
          # SHA 대신 브랜치명(main)으로 주면 체크아웃은 이 스텝이 실제로 실행되는 시점의 main 최신 커밋으로
          # 해결되므로(actions/checkout 공식 동작), 추가 fetch/reset 명령 없이도 오래된 트리거 SHA로 멈추는
          # 문제(대기 중 다른 실행이 먼저 생성 파일 커밋을 올려 이후 rebase가 충돌할 가능성)을 막습니다.
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 사진 없는 소식에 썸네일 채우기 (원문 → 우회 → 본문 → 이미지 검색)
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          # 한 번 실행 시 이미지 검색에 쓰는 전체 시간 예산(초). 짧게 묶어서 같은
          # concurrency 그룹을 기다리는 글 게시(add-news)가 오래 막히지 않게 함.
          # 못 다 채운 항목은 다음 실행(하루 1회 예약 실행 또는 다음 게시 직후)에 이어서 처리.
          FILL_IMAGES_TIME_BUDGET_SEC: "240"
        run: python3 scripts/fill_images.py

      - name: 형식 검사 + RSS·검색용 페이지 갱신
        run: python3 scripts/build.py

      - name: 바뀐 내용 반영
        id: commit
        run: |
          git add -A news.json rss.xml sitemap.xml stats.json index.html n
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "proaudio-wire-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "소식 사진 자동 채우기"
          # force push는 절대 쓰지 않음. pull --rebase가 충돌로 실패하면:
          #  - 충돌 파일이 전부 순수 생성 파일(stats.json/rss.xml/sitemap.xml/n/*.html)뿐이면
          #    scripts/reconcile_generated.py로 병합된 news.json 기준으로 다시 계산해서만 이어갑니다.
          #    index.html은 정적 구조와 생성 구간이 섮인 파일이라 이 허용 목록에서 제외했습니다(index.html
          #    자체가 충돌된 경우는 항상 원본 충돌로 취급해 즉시 실패함 — PRERENDER/COUPANG_PICKS 주입
          #    구간 밖에서 사람이 직접 고친 정적 내용이 충돌했을 수 있어 길린 git 충돌 표시가
          #    조용히 커밋되는 일을 막기 위함). news.json은 이 스크립트가 읽기만 하고 절대 쓰지 않음.
          #  - news.json/index.html 등 원본 충돌이 하나라도 섞여 있거나 재생성 자체가 실패하면
          #    즉시 rebase를 중단하고 "명확하게 한 번" 실패합니다 — 자동으로 고쳐지지 않는
          #    내용 충돌을 5번 동일하게 반복 재시도하지 않음(이전에는 매번 같은 충돌로 5회
          #    모두 동일하게 실패해 사진은 처리되고도 아무것도 반영되지 못하는 문제가 있었음).
          #  - 충돌이 아니라 네트워크 등으로 pull --rebase 자체가 실패하거나, rebase는 성공했는데
          #    push만 경합으로 실패하는 경우는 여전히 재시도 대상입니다(일시적·경주성 문제일 수 있음).
          #  - rebase --continue는 GIT_EDITOR=true로 돌려 커밋 메시지 편집기를 열지 않게 합니다(CI에는 TTY가
          #    없어 편집기가 열리면 멈춤; `--no-edit`는 git 버전에 따라 `rebase --continue`에서
          #    지원되지 않을 수 있어 써지 않음).
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main; then
              if git push origin HEAD:main; then
                echo "pushed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::warning::rebase는 성공했지만 push 실패(다른 업데이트와 경합) - 재시도 ($i/5)"
            else
              conflicts="$(git diff --name-only --diff-filter=U)"
              if [ -z "$conflicts" ]; then
                git rebase --abort || true
                echo "::warning::pull --rebase 실패(충돌 아님 — 네트워크 등) - 중단 후 재시도 ($i/5)"
              elif python3 scripts/reconcile_generated.py; then
                if GIT_EDITOR=true git rebase --continue; then
                  echo "순수 생성 파일 전용 충돌을 재생성으로 해결하고 rebase를 이어감"
                else
                  git rebase --abort || true
                  echo "::warning::재생성 후에도 rebase --continue 실패 - 중단 후 재시도 ($i/5)"
                fi
              else
                git rebase --abort || true
                echo "::error::news.json/index.html 등 원본 충돌이 있거나 재생성이 실패함 — 자동으로 고치지 않고 즉시 실패합니다 (고쳐지지 않는 충돌을 5번 반복 재시도하지 않음). 충돌 파일: $conflicts"
                echo "pushed=false" >> "$GITHUB_OUTPUT"
                exit 1
              fi
            fi
            sleep $((i * 5))
          done
          echo "::error::푸시 실패 (다른 업데이트와 겹침, 충돌은 아님). 다음 실행 때 다시 시도합니다."
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: GitHub Pages 빌드 요청 (GITHUB_TOKEN 커밋은 Pages 빌드를 자동으로 트리거하지 않음 — 공식 문서 확인됨)
        if: steps.commit.outputs.pushed == 'true'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            try {
              await github.rest.repos.requestPagesBuild({ owner: context.repo.owner, repo: context.repo.repo });
              core.notice('GitHub Pages 빌드를 요청했습니다.');
            } catch (e) {
              core.setFailed('GitHub Pages 빌드 요청 실패: ' + (e && e.message ? e.message : String(e)));
            }
