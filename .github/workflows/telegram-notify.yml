name: Telegram 새 소식 알림

on:
  push:
    branches: [main]
    paths:
      - "news.json"
  workflow_dispatch:
    inputs:
      test:
        description: "연결 테스트 메시지 보내기 (1 = 예)"
        required: false
        default: "1"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 새 소식만 골라 텔레그램 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MESSAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.test || '0' }}
        run: python3 scripts/notify_telegram.py
