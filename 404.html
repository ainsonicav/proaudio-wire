<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>페이지를 찾을 수 없습니다 | 프로오디오뉴스 PRO AUDIO WIRE</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8fafc;color:#0f172a;font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.7;word-break:keep-all;padding:1.5rem}
  main{max-width:520px;width:100%;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:2.2rem 1.6rem;text-align:center;box-shadow:0 1px 3px rgba(15,23,42,.06)}
  .brand{display:inline-flex;align-items:center;gap:.5rem;font-weight:800;letter-spacing:.04em;color:#9F1239;text-decoration:none;font-size:.95rem}
  .brand i{width:22px;height:22px;border-radius:50%;border:5px solid #e11d48;display:inline-block}
  .code{margin:1.4rem 0 .2rem;font-size:.8rem;font-weight:700;letter-spacing:.2em;color:#e11d48}
  h1{font-size:1.45rem;line-height:1.35;margin:0 0 .6rem}
  p{margin:0 0 1.4rem;color:#475569;font-size:.95rem}
  .btns{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center}
  .btn{display:inline-flex;align-items:center;min-height:44px;padding:0 1.1rem;border-radius:8px;font-weight:600;font-size:.92rem;text-decoration:none;background:#e11d48;color:#fff}
  .btn.sub{background:#fff;color:#0f172a;border:1px solid #cbd5e1}
  .btn:hover{filter:brightness(1.05)}
  :focus-visible{outline:3px solid #fda4af;outline-offset:2px}
</style>
</head>
<body>
<main>
  <a class="brand" href="/"><i aria-hidden="true"></i>PRO AUDIO WIRE</a>
  <p class="code">404</p>
  <h1>찾으시는 페이지가 없습니다</h1>
  <p>주소가 바뀌었거나 삭제된 소식입니다.<br>프로오디오뉴스 첫 화면에서 전체 소식을 확인해 보세요.</p>
  <div class="btns">
    <a class="btn" href="/">프로오디오뉴스 홈으로</a>
    <a class="btn sub" href="https://www.ainsonic.com/">아인소닉 홈페이지</a>
  </div>
</main>
</body>
</html>
