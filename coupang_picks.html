<!-- 프로오디오 뉴스 (news.ainsonic.com) - 사이드 광고 레일 (쿠팡/알리 파트너스 추천 장비) -->
<!-- ============================================================== -->
<aside id="ad-rail">
  <style>
    /* 글로벌 레이아웃 조작: 1280px 이상 데스크톱에서 main.container를 Grid로 변경 */
    @media (min-width: 1280px) {
      main.container {
        display: grid !important;
        grid-template-columns: minmax(0, 1fr) 240px !important;
        gap: 0 32px !important;
        align-items: start;
      }
      main.container > * {
        grid-column: 1;
      }
      main.container > #ad-rail {
        grid-column: 2;
        grid-row: 1 / 100; /* 맨 아래 DOM에 있어도 오른쪽 끝에 전체 높이로 배치 */
      }
    }

    /* CSS 스코프: #ad-rail 하위로 격리 */
    #ad-rail {
      background-color: transparent;
      box-sizing: border-box;
      line-height: 1.6;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* 1280px 이상에서는 스티키 적용 */
    @media (min-width: 1280px) {
      #ad-rail {
        position: sticky;
        top: 16px;
        max-height: calc(100vh - 32px);
        overflow-y: auto;
      }
      /* 스크롤바 숨김 (선택 사항) */
      #ad-rail::-webkit-scrollbar {
        width: 6px;
      }
      #ad-rail::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
    }

    /* 1280px 미만에서는 기존처럼 컨테이너 아래쪽 중앙 배치 */
    @media (max-width: 1279px) {
      #ad-rail {
        margin: 40px auto;
        max-width: 1200px;
        background-color: transparent;
      }
    }

    #ad-rail *, #ad-rail *::before, #ad-rail *::after {
      box-sizing: border-box;
    }

    /* 섹션 공통 스타일 */
    .ar-section {
      background-color: #F8FAFC;
      border-radius: 8px;
      padding: 20px 16px;
      margin-bottom: 24px;
    }

    .ar-section:last-child {
      margin-bottom: 0;
    }

    .cp-header {
      margin-bottom: 16px;
    }
    .cp-title {
      margin: 0 0 6px 0;
      font-size: 16px;
      font-weight: 700;
      color: #0F172A;
      letter-spacing: -0.02em;
    }
    .cp-notice-top {
      margin: 0;
      font-size: 11px;
      color: #64748B;
      letter-spacing: -0.01em;
      line-height: 1.4;
    }

    /* 카드 그리드 */
    .cp-grid {
      display: grid;
      gap: 16px;
      /* 기본적으로 모바일 1열, 데스크톱 1열 */
      grid-template-columns: 1fr;
    }

    /* 1280px 미만 (태블릿/작은 데스크톱) - 2열 */
    @media (min-width: 600px) and (max-width: 1279px) {
      .cp-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    /* 1280px 이상은 레일폭이 좁으므로 다시 1열 (기본값 적용) */

    .cp-card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* 이미지 영역 1:1, 안잘리게, 안쪽여백 8px */
    .cp-img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: #FFFFFF;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-bottom: 1px solid #E2E8F0;
    }
    .cp-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .cp-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #94A3B8;
      width: 100%;
      height: 100%;
      background-color: #F1F5F9;
      user-select: none;
    }
    .cp-placeholder-icon {
      width: 24px;
      height: 24px;
      stroke: #94A3B8;
      stroke-width: 1.5;
      fill: none;
    }
    .cp-placeholder-text {
      font-size: 11px;
      font-weight: 500;
      color: #94A3B8;
      letter-spacing: -0.01em;
    }

    /* 본문 영역 */
    .cp-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .cp-brand {
      font-size: 10px;
      font-weight: 700;
      color: #334155;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }
    .cp-name {
      margin: 0 0 6px 0;
      font-size: 13px;
      font-weight: 600;
      color: #0F172A;
      line-height: 1.4;
      letter-spacing: -0.01em;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      min-height: 36px;
    }
    .cp-category {
      font-size: 11px;
      color: #64748B;
      margin-bottom: 12px;
    }
    .cp-action {
      margin-top: auto;
    }
    .cp-btn {
      display: block;
      width: 100%;
      padding: 8px 12px;
      background-color: #334155;
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      border: 1px solid #334155;
      border-radius: 4px;
      box-sizing: border-box;
      cursor: pointer;
      line-height: 1.4;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .cp-btn:hover {
      background-color: #1E293B;
      border-color: #1E293B;
    }
    .cp-btn-disabled,
    .cp-btn-disabled:hover {
      background-color: #F1F5F9;
      color: #94A3B8;
      border-color: #E2E8F0;
      cursor: not-allowed;
    }
  
    /* 데스크톱 사이드 추천: 폭·링크·고지는 유지하고 카드 높이를 약 절반으로 축소 */
    @media (min-width: 1280px) {
      #ad-rail .cp-grid { gap: 8px; }
      #ad-rail .cp-img-wrap { height: 64px; aspect-ratio: auto; padding: 4px; }
      #ad-rail .cp-body { padding: 6px 8px; }
      #ad-rail .cp-brand { margin-bottom: 2px; }
      #ad-rail .cp-name { font-size: 12px; line-height: 1.35; min-height: 32.4px; margin-bottom: 4px; }
      #ad-rail .cp-category { font-size: 10px; line-height: 1.4; margin-bottom: 4px; }
      #ad-rail .cp-btn { padding: 4px 8px; font-size: 11px; line-height: 1.4; }
    }
  </style>


  <style>
    /* 음향 / 영상 / CCTV 영역 구분 (#ad-rail 하위로만 적용) */
    #ad-rail .ar-area-title { margin: 0 0 12px 0; padding-bottom: 8px; border-bottom: 2px solid #334155; font-size: 15px; font-weight: 800; color: #0F172A; letter-spacing: -0.02em; }
    #ad-rail .ar-store { margin: 0 0 12px 0; }
    #ad-rail .ar-store:last-child { margin-bottom: 0; }
    #ad-rail .ar-store-title { margin: 0 0 4px 0; font-size: 13px; font-weight: 700; color: #334155; }
    #ad-rail .ar-store .cp-notice-top { margin-bottom: 8px; }
    #ad-rail .ar-empty { margin: 0; padding: 12px 8px; text-align: center; font-size: 12px; color: #64748B; background: #FFFFFF; border: 1px dashed #CBD5E1; border-radius: 6px; }
  </style>

  <!-- 음향 / 영상 / CCTV 영역 (제품은 아래 스크립트의 데이터에서 영역별로 렌더링) -->
  <section id="area-audio" class="ar-section ar-area" data-area="audio">
    <h2 class="ar-area-title">음향 추천 장비</h2>
    <div class="ar-area-body"></div>
  </section>
  <section id="area-video" class="ar-section ar-area" data-area="video">
    <h2 class="ar-area-title">영상 추천 장비</h2>
    <div class="ar-area-body"></div>
  </section>
  <section id="area-cctv" class="ar-section ar-area" data-area="cctv">
    <h2 class="ar-area-title">CCTV 추천 장비</h2>
    <div class="ar-area-body"></div>
  </section>

  <script>
    (function () {
      // 영역별·쇼핑몰별 최대 표시 개수 (인기순으로 앞에서부터 이 개수만큼만 표시)
      const MAX_PER_STORE = 6;

      // 쿠팡 파트너스 데이터 (area: audio=음향, video=영상, cctv=CCTV / 배열 앞쪽일수록 인기순)
      const PRODUCTS = [
        { area: "audio", brand: "Focusrite", name: "포커스라이트 Scarlett 2i2 4세대 오디오 인터페이스", category: "오디오 인터페이스", image: "https://t1c.coupangcdn.com/thumbnails/remote/492x492ex/image/retail/images/2023/09/15/15/6/8d42e4f3-3d52-4c01-9b84-8704587923fe.jpg", url: "https://link.coupang.com/a/hsPh7tYH1M" },
        { area: "audio", brand: "Yamaha", name: "야마하 HS5 스튜디오 모니터 스피커", category: "스튜디오 모니터", image: "https://thumbnail.coupangcdn.com/thumbnails/remote/492x492ex/image/vendor_inventory/3a5e/20692ec2e81433d019b4d70a9dc81fc294ae44d8ee5383b2f9c75b8916ea.jpg", url: "https://link.coupang.com/a/hsQOK7OJVI" },
        { area: "audio", brand: "Shure", name: "슈어 SM58-LC 마이크 + 케이블 5m 세트", category: "마이크", image: "https://t2a.coupangcdn.com/thumbnails/remote/492x492ex/image/vendor_inventory/image_audit/stage/manual/5da90e14ce91d3b8561649c4fa0bb8c38206be01af3ff0d88be197dacd38_1771981080495.jpg", url: "https://link.coupang.com/a/hsPd5E6sA8" },
        { area: "audio", brand: "Audio-Technica", name: "오디오테크니카 ATH-M50x 모니터링 헤드폰 블랙", category: "헤드폰", image: "https://thumbnail8.coupangcdn.com/thumbnails/remote/492x492ex/image/retail/images/2019/09/02/12/2/c0e12dc2-a813-4e70-872c-d86f43f3ace6.jpg", url: "https://link.coupang.com/a/hsPeU5CAHQ" },
        { area: "audio", brand: "Mogami", name: "MOGAMI Gold Studio XLR 마이크 케이블 3M", category: "케이블", image: "https://t4a.coupangcdn.com/thumbnails/remote/492x492ex/image/vendor_inventory/image_audit/stage/manual/b05ea39f584bb8cff45e8f272ce1dd8bfb4769356becef4bae3319b6ed3a_1759137929903.jpg", url: "https://link.coupang.com/a/hsPfWHtjWe" },
        { area: "audio", brand: "K&M", name: "K&M 프로페셔널 스탠드 25400", category: "스탠드", image: "https://t1a.coupangcdn.com/thumbnails/remote/492x492ex/image/vendor_inventory/df0b/005037712291480978d453150c9f0daeaf95dbc23c09869bad5f8b0b5bec.jpg", url: "https://link.coupang.com/a/hsPg48XOHQ" }
      ];

      // 알리익스프레스 데이터 (area: audio=음향, video=영상, cctv=CCTV / 배열 앞쪽일수록 인기순)
      const ALI_PRODUCTS = [
        { area: "audio", brand: "the brilliant 3C Store", name: "XLR 마이크 케이블 (수-암, 1~10m)", category: "케이블", image: "https://ae-pic-a1.aliexpress-media.com/kf/S9742b1e5e4af4e57b5ca49bec5abaeb9H.jpg", url: "https://s.click.aliexpress.com/e/_c3fepNAD" },
        { area: "audio", brand: "Guitary Best Shop", name: "Shure SM7B용 마이크 팝필터 윈드스크린", category: "마이크 액세서리", image: "https://ae-pic-a1.aliexpress-media.com/kf/Sfbc57a4141e44cad92ad5b7f7166d4043.jpg", url: "https://s.click.aliexpress.com/e/_c33S6DJ3" },
        { area: "audio", brand: "perngy tech", name: "360도 회전 데스크탑 스피커 스탠드 (2개 1세트)", category: "스탠드", image: "https://ae-pic-a1.aliexpress-media.com/kf/S8cdc61decfc440e683b6f5a6cffb2693q.jpg", url: "https://s.click.aliexpress.com/e/_c3BkZkwd" },
        { area: "audio", brand: "All Goods All Styles", name: "무타공 클립형 헤드폰 거치대", category: "헤드폰 액세서리", image: "https://ae-pic-a1.aliexpress-media.com/kf/S9e1951e59f9a4d7690e9a7fac9a838afC.jpg", url: "https://s.click.aliexpress.com/e/_c41cXkLJ" },
        { area: "audio", brand: "JOYO", name: "JOYO MOMIX CAB 미니 USB 오디오 인터페이스", category: "오디오 인터페이스", image: "https://ae-pic-a1.aliexpress-media.com/kf/S3c27c7ed834548149763a7521e816c5bx.jpg", url: "https://s.click.aliexpress.com/e/_c3XxWeGD" },
        { area: "audio", brand: "Audio Cable Shop", name: "6.35mm TRS - XLR 오디오 케이블", category: "케이블", image: "https://ae-pic-a1.aliexpress-media.com/kf/S3f74ea3284a2485ebd0549a14262b3b8W.jpg", url: "https://s.click.aliexpress.com/e/_c42zWBDf" }
      ];

      function escapeHtml(str) {
        if (!str) return "";
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function renderCards(gridId, data, btnText) {
        const grid = document.getElementById(gridId);
        if (!grid) return;

        const placeholderSvg =
          '<svg class="cp-placeholder-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">' +
          '<rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>' +
          '<circle cx="8.5" cy="8.5" r="1.5"></circle>' +
          '<polyline points="21 15 16 10 5 21"></polyline>' +
          '</svg>';

        grid.innerHTML = data.map(function (item) {
          const hasImage = item.image && item.image.trim() !== "";
          const hasUrl = item.url && item.url.trim() !== "";

          const imageContent = hasImage
            ? '<img src="' + escapeHtml(item.image) + '" alt="' + escapeHtml(item.name) + '" class="cp-img" loading="lazy" />'
            : '<div class="cp-placeholder">' +
                placeholderSvg +
                '<span class="cp-placeholder-text">이미지 준비 중</span>' +
              '</div>';

          const buttonContent = hasUrl
            ? '<a href="' + escapeHtml(item.url) + '" target="_blank" rel="sponsored noopener noreferrer" class="cp-btn">' + btnText + '</a>'
            : '<button type="button" disabled class="cp-btn cp-btn-disabled">링크 준비 중</button>';

          return (
            '<article class="cp-card">' +
              '<div class="cp-img-wrap">' +
                imageContent +
              '</div>' +
              '<div class="cp-body">' +
                '<div class="cp-brand">' + escapeHtml(item.brand || "BRAND") + '</div>' +
                '<h3 class="cp-name">' + escapeHtml(item.name || "") + '</h3>' +
                '<div class="cp-category">' + escapeHtml(item.category || "") + '</div>' +
                '<div class="cp-action">' +
                  buttonContent +
                '</div>' +
              '</div>' +
            '</article>'
          );
        }).join("");
      }

      function renderAdRail() {
        document.querySelectorAll("#ad-rail .ar-area").forEach(function (sec) {
          const area = sec.getAttribute("data-area");
          const body = sec.querySelector(".ar-area-body");
          if (!body) return;
          const cpItems = PRODUCTS.filter(function (p) { return p.area === area; }).slice(0, MAX_PER_STORE);
          const aliItems = ALI_PRODUCTS.filter(function (p) { return p.area === area; }).slice(0, MAX_PER_STORE);
          let html = "";
          if (cpItems.length) {
            html += '<div class="ar-store">' +
              '<h3 class="ar-store-title">쿠팡 파트너스</h3>' +
              '<p class="cp-notice-top">이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>' +
              '<div id="coupang-picks-grid-' + area + '" class="cp-grid"></div></div>';
          }
          if (aliItems.length) {
            html += '<div class="ar-store">' +
              '<h3 class="ar-store-title">알리익스프레스</h3>' +
              '<p class="cp-notice-top">이 영역에는 알리익스프레스 제휴 링크가 포함되어 있으며, 구매 시 운영자가 일정 수수료를 받을 수 있습니다.</p>' +
              '<div id="aliexpress-picks-grid-' + area + '" class="cp-grid"></div></div>';
          }
          if (!html) html = '<p class="ar-empty">추천 제품 준비 중입니다.</p>';
          body.innerHTML = html;
          if (cpItems.length) renderCards("coupang-picks-grid-" + area, cpItems, "쿠팡에서 보기");
          if (aliItems.length) renderCards("aliexpress-picks-grid-" + area, aliItems, "알리에서 보기");
        });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", renderAdRail);
      } else {
        renderAdRail();
      }
    })();
  </script>
</aside>
