<!-- 운영 메모: 우측 세로 썸네일 배너(쿠팡 파트너스). scripts/build.py가 index.html의 COUPANG_PICKS 구간에 주입.
     이 파일 자체는 _config.yml exclude로 공개 주소에서 제외(주입되므로 meta robots를 넣지 마세요).
     링크/이미지: 파트너스 대시보드 '상품 링크 > 이미지+텍스트 > HTML(블로그용 태그)' 원문 그대로 사용(이미지 자체 호스팅 금지).
     데스크톱(≥1280px): main.container 오른쪽 열(그리드) + sticky. 본문을 가리는 fixed/플로팅 배너 아님.
     모바일(≤1279px): 본문 아래, 대가성 문구 → 가로 스크롤 카드. -->
<aside id="ad-rail" aria-label="추천 장비 (쿠팡 파트너스)">
  <style>
    @media (min-width: 1280px) {
      /* 기존 html,body{overflow-x:hidden}은 body를 스크롤 컨테이너로 만들어 sticky가 동작하지 않음 → clip(스크롤 컨테이너 아님) */
      html, body { overflow-x: clip; }
      main.container {
        display: grid !important;
        grid-template-columns: minmax(0, 1fr) 176px !important;
        gap: 0 24px !important;
        align-items: start;
      }
      main.container > * { grid-column: 1; }
      main.container > #ad-rail {
        grid-column: 2;
        grid-row: 1 / 100; /* DOM 맨 아래에 있어도 오른쪽 열 전체 높이 */
      }
      #ad-rail {
        position: sticky;
        top: 80px; /* sticky 헤더 아래 */
        max-height: calc(100vh - 96px);
        overflow-y: auto;
      }
      #ad-rail::-webkit-scrollbar { width: 4px; }
      #ad-rail::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    }
    @media (max-width: 1279px) {
      #ad-rail { margin: 2rem auto 0; max-width: 1240px; }
    }

    #ad-rail, #ad-rail * { box-sizing: border-box; }
    #ad-rail {
      width: 100%;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px;
      color: #0b1c30;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      font-size: 12px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    #ad-rail .ad-rail-header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 6px; margin-bottom: 8px;
    }
    #ad-rail .ad-rail-title { font-size: 14px; font-weight: 700; color: #0b1c30; letter-spacing: -0.01em; }
    #ad-rail .ad-rail-badge {
      font-size: 11px; font-weight: 600; color: #475569;
      background: #f1f5f9; padding: 2px 7px; border-radius: 4px; white-space: nowrap;
    }
    /* 대가성 문구: 레일 최상단(데스크톱·모바일 모두 카드보다 위) */
    #ad-rail .ad-rail-notice {
      margin: 0 0 10px;
      padding: 8px 9px;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 8px;
      color: #9a3412;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.4;
    }
    #ad-rail .ad-rail-list {
      list-style: none; margin: 0; padding: 0;
      display: flex; flex-direction: column; gap: 8px;
    }
    #ad-rail .ad-rail-list > li { margin: 0; padding: 0; }
    #ad-rail .ad-rail-card {
      display: flex; flex-direction: row; align-items: center; gap: 8px;
      border: 1px solid #e2e8f0; border-radius: 10px;
      padding: 6px; background: #f8fafc;
      text-decoration: none; color: inherit;
      transition: border-color .15s, box-shadow .15s;
    }
    #ad-rail a.ad-rail-card:hover { border-color: #fb923c; box-shadow: 0 1px 4px rgba(15,23,42,.08); }
    /* 쿠팡 배너 이미지(120×240) 원본 비율 그대로 표시 — 자르거나 변형하지 않음 */
    #ad-rail .ad-rail-thumb {
      flex: 0 0 auto;
      width: 56px; height: auto; aspect-ratio: 1 / 2;
      background: #fff; border-radius: 6px; display: block;
    }
    #ad-rail .ad-rail-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    #ad-rail .ad-rail-brand {
      font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: .02em;
    }
    #ad-rail .ad-rail-name {
      font-size: 12px; font-weight: 700; color: #0f172a; word-break: keep-all;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    #ad-rail .ad-rail-cta {
      margin-top: 2px; font-size: 11px; font-weight: 700; color: #c2410c; text-align: center;
      background: #ffedd5; border-radius: 6px; padding: 4px 6px;
    }
    #ad-rail .ad-rail-hint { margin: 10px 0 0; font-size: 10px; color: #64748b; line-height: 1.35; }

    @media (max-width: 1279px) {
      #ad-rail .ad-rail-list {
        flex-direction: row; overflow-x: auto; gap: 10px; padding-bottom: 4px;
        -webkit-overflow-scrolling: touch;
      }
      #ad-rail .ad-rail-list > li { flex: 0 0 140px; display: flex; }
      #ad-rail .ad-rail-card { flex-direction: column; align-items: stretch; width: 100%; padding: 8px; }
      #ad-rail .ad-rail-thumb { width: 96px; margin: 0 auto; }
      #ad-rail .ad-rail-text { flex: 1; }
      #ad-rail .ad-rail-cta { margin-top: auto; }
    }
  </style>
