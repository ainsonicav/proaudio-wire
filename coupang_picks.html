<!-- ============================================================== -->
<!-- 프로오디오 뉴스 (news.ainsonic.com) - 쿠팡 파트너스 추천 장비 섹션 -->
<!-- ============================================================== -->
<section id="coupang-picks">
  <style>
    /* CSS 스코프: #coupang-picks 하위로 격리되어 기존 사이트와 스타일 충돌이 없습니다. */
    #coupang-picks {
      background-color: #F8FAFC;
      color: #0F172A;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 40px 20px;
      margin: 40px auto;
      max-width: 1200px;
      box-sizing: border-box;
      line-height: 1.6;
    }
    #coupang-picks *, #coupang-picks *::before, #coupang-picks *::after {
      box-sizing: border-box;
    }
    #coupang-picks .cp-header {
      margin-bottom: 24px;
    }
    #coupang-picks .cp-title {
      margin: 0 0 8px 0;
      font-size: 22px;
      font-weight: 700;
      color: #0F172A;
      letter-spacing: -0.02em;
    }
    #coupang-picks .cp-notice-top {
      margin: 0;
      font-size: 13px;
      color: #64748B;
      letter-spacing: -0.01em;
      line-height: 1.5;
    }
    #coupang-picks .cp-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }
    #coupang-picks .cp-card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    #coupang-picks .cp-img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background-color: #F1F5F9;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-bottom: 1px solid #E2E8F0;
    }
    #coupang-picks .cp-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    #coupang-picks .cp-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #94A3B8;
      width: 100%;
      height: 100%;
      background-color: #F1F5F9;
      user-select: none;
    }
    #coupang-picks .cp-placeholder-icon {
      width: 38px;
      height: 38px;
      stroke: #94A3B8;
      stroke-width: 1.5;
      fill: none;
    }
    #coupang-picks .cp-placeholder-text {
      font-size: 12px;
      font-weight: 500;
      color: #94A3B8;
      letter-spacing: -0.01em;
    }
    #coupang-picks .cp-body {
      padding: 18px 16px 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    #coupang-picks .cp-brand {
      font-size: 11px;
      font-weight: 700;
      color: #334155;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }
    #coupang-picks .cp-name {
      margin: 0 0 8px 0;
      font-size: 15px;
      font-weight: 600;
      color: #0F172A;
      line-height: 1.45;
      letter-spacing: -0.01em;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      min-height: 44px;
    }
    #coupang-picks .cp-category {
      font-size: 12px;
      color: #64748B;
      margin-bottom: 16px;
    }
    #coupang-picks .cp-action {
      margin-top: auto;
    }
    #coupang-picks .cp-btn {
      display: block;
      width: 100%;
      padding: 10px 14px;
      background-color: #334155;
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      border: 1px solid #334155;
      border-radius: 4px;
      box-sizing: border-box;
      cursor: pointer;
      line-height: 1.4;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    #coupang-picks .cp-btn:hover {
      background-color: #1E293B;
      border-color: #1E293B;
    }
    #coupang-picks .cp-btn-disabled,
    #coupang-picks .cp-btn-disabled:hover {
      background-color: #F1F5F9;
      color: #94A3B8;
      border-color: #E2E8F0;
      cursor: not-allowed;
    }
    #coupang-picks .cp-notice-bottom {
      margin: 32px 0 0 0;
      padding-top: 18px;
      border-top: 1px solid #E2E8F0;
      font-size: 12px;
      color: #64748B;
      letter-spacing: -0.01em;
      text-align: center;
      line-height: 1.5;
    }
    @media (max-width: 960px) {
      #coupang-picks .cp-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    @media (max-width: 600px) {
      #coupang-picks {
        padding: 24px 16px;
      }
      #coupang-picks .cp-grid {
        grid-template-columns: 1fr;
      }
      #coupang-picks .cp-title {
        font-size: 19px;
      }
    }
  </style>

  <div class="cp-header">
    <h2 class="cp-title">추천 장비 (쿠팡 파트너스)</h2>
    <p class="cp-notice-top">이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>
  </div>

  <div id="coupang-picks-grid" class="cp-grid">
    <!-- 제품 카드가 스크립트에 의해 자동 생성됩니다 -->
  </div>

  <p class="cp-notice-bottom">이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>

  <script>
    (function () {
      // ==========================================
      // [제품 데이터 정의]
      // 실제 정보 등록 시 아래 6개 항목의 값을 수정하세요.
      // - url이 빈 문자열("")이면 자동으로 '링크 준비 중' 비활성화 버튼이 표시됩니다.
      // - image가 빈 문자열("")이면 4:3 비율의 회색 자리표시자가 나타납니다.
      // ==========================================
      const PRODUCTS = [
        {
          brand: "브랜드 예시",
          name: "오디오 인터페이스 추천 제품명 (2줄까지 표시 가능)",
          category: "오디오 인터페이스",
          image: "",
          url: ""
        },
        {
          brand: "브랜드 예시",
          name: "스튜디오 모니터 스피커 추천 제품명 (2줄까지 표시 가능)",
          category: "스튜디오 모니터",
          image: "",
          url: ""
        },
        {
          brand: "브랜드 예시",
          name: "콘덴서 / 다이내믹 마이크 추천 제품명 (2줄까지 표시 가능)",
          category: "마이크",
          image: "",
          url: ""
        },
        {
          brand: "브랜드 예시",
          name: "프로용 모니터링 헤드폰 추천 제품명 (2줄까지 표시 가능)",
          category: "헤드폰",
          image: "",
          url: ""
        },
        {
          brand: "브랜드 예시",
          name: "고품질 마이크 / 악기 케이블 추천 제품명",
          category: "케이블",
          image: "",
          url: ""
        },
        {
          brand: "브랜드 예시",
          name: "견고한 스튜디오 마이크 / 스피커 스탠드 추천 제품명",
          category: "스탠드",
          image: "",
          url: ""
        }
      ];

      function escapeHtml(str) {
        if (!str) return "";
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function renderCoupangPicks() {
        const grid = document.getElementById("coupang-picks-grid");
        if (!grid) return;

        const placeholderSvg =
          '<svg class="cp-placeholder-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">' +
          '<rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>' +
          '<circle cx="8.5" cy="8.5" r="1.5"></circle>' +
          '<polyline points="21 15 16 10 5 21"></polyline>' +
          '</svg>';

        grid.innerHTML = PRODUCTS.map(function (item) {
          const hasImage = item.image && item.image.trim() !== "";
          const hasUrl = item.url && item.url.trim() !== "";

          const imageContent = hasImage
            ? '<img src="' + escapeHtml(item.image) + '" alt="' + escapeHtml(item.name) + '" class="cp-img" loading="lazy" />'
            : '<div class="cp-placeholder">' +
                placeholderSvg +
                '<span class="cp-placeholder-text">이미지 준비 중</span>' +
              '</div>';

          const buttonContent = hasUrl
            ? '<a href="' + escapeHtml(item.url) + '" target="_blank" rel="sponsored noopener noreferrer" class="cp-btn">쿠팡에서 보기</a>'
            : '<button type="button" disabled class="cp-btn cp-btn-disabled">링크 준비 중</button>';

          return (
            '<article class="cp-card">' +
              '<div class="cp-img-wrap">' +
                imageContent +
              '</div>' +
              '<div class="cp-body">' +
                '<div class="cp-brand">' + escapeHtml(item.brand || "BRAND") + '</div>' +
                '<h3 class="cp-name">' + escapeHtml(item.name || "") + '</h3>' +
                '<div class="cp-category">' + escapeHtml(item.category || "") + '</div>' +
                '<div class="cp-action">' +
                  buttonContent +
                '</div>' +
              '</div>' +
            '</article>'
          );
        }).join("");
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", renderCoupangPicks);
      } else {
        renderCoupangPicks();
      }
    })();
  </script>
</section>
